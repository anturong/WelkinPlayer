name: Build Batocera AppImage

# 上游发新版本后产出「可直接用于 Batocera 的 AppImage」并发 Release。
#
# 触发方式：
#   - 手动：Actions -> Build Batocera AppImage -> Run workflow（可指定上游 tag/源码 ref、可强制重建）
#   - 定时：每天检查一次上游 release，有新版就自动构建
#   - 打 rebuild-* tag 触发
#
# 产物 = 上游 release 里的 AppImage（含它自带的 WebKit/GTK 栈）
#        + Batocera 适配（替换掉打崩系统 dbus 的 libdbus、无 3D 时让 WebKit 走软件路径）
#        + 用本仓库补丁重编的 welkinplayer（Escape 退出 + 全屏可视化）
#
# 不再打包 GStreamer/libav 闭包：新版播放由 rodio/symphonia 在 Rust 里解码，
# 不经过 webview 的 GStreamer。只有上游回退到旧架构时才需要（可传 payload）。

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 tag（留空 = 取最新 release，用它下载 AppImage 外壳）'
        required: false
        default: ''
      upstream_ref:
        description: '编二进制用的源码 ref（默认钉在上游新架构的 main；补丁失配会明确报错）'
        required: false
        default: '0c50d2bddd81289e1705642a97e82da6ef220bbf'
      force:
        description: '该版本已构建过也强制重建（自动递增修订号 r2、r3…）'
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * *'
  push:
    tags:
      - 'rebuild-*'

permissions:
  contents: write

concurrency:
  group: batocera-appimage
  cancel-in-progress: false

env:
  UPSTREAM: atemukesu/WelkinPlayer

jobs:
  # ---------------------------------------------------------------- 解析版本 / 判断是否需要构建
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      appimage_url: ${{ steps.pick.outputs.appimage_url }}
      skip: ${{ steps.pick.outputs.skip }}
      rev: ${{ steps.pick.outputs.rev }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tag="${WANT:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          version="${tag#v}"
          echo "上游 tag: $tag    版本: $version"
          url=$(gh api "repos/${UPSTREAM}/releases/tags/${tag}" \
                --jq '.assets[] | select(.name | test("amd64.*\\.AppImage$")) | .browser_download_url' | head -1)
          [ -n "$url" ] || { echo "::error::在 $tag 里找不到 amd64 AppImage 资产"; exit 1; }
          echo "AppImage: $url"
          skip=false
          rev=1
          if gh release view "batocera-${version}-r1" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rev=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName \
                  --jq "[.[] | select(.tagName | startswith(\"batocera-${version}-r\"))] | length + 1")
            if [ "$FORCE" != "true" ]; then
              echo "已存在 batocera-${version}-r*，跳过构建（需要重建请勾选 force）"
              skip=true
            else
              echo "强制重建：本次将发布 batocera-${version}-r${rev}"
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "appimage_url=$url"
            echo "skip=$skip"
            echo "rev=$rev"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 构建
  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-22.04        # 与 AppImage 的 jammy 基准同源，glibc 比 Batocera 旧
    steps:
      - name: 取本仓库（脚本与补丁）
        uses: actions/checkout@v4
        with:
          ref: batocera
          path: kit

      - name: 取上游源码（补丁基线）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref || '0c50d2bddd81289e1705642a97e82da6ef220bbf' }}
          path: upstream

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools file pkg-config patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libasound2-dev libxdo-dev     # cpal/alsa-sys 与 tauri 的 xdo 需要（debug 单测也会编到）

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/src-tauri

      - name: 下载上游 AppImage（外壳）
        run: curl -fL --retry 3 -o upstream.AppImage "${{ needs.resolve.outputs.appimage_url }}"

      - name: 打补丁（Escape 退出 + 全屏可视化）
        working-directory: upstream
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in ../kit/batocera/patches/*.diff; do
            echo "== 应用 $p"
            git apply --verbose "$p" || {
              echo "::error::补丁 $p 无法应用到 ${{ inputs.upstream_ref || 'main' }}，需要先更新补丁"
              exit 1
            }
          done

      - name: 构建前端 + 单测 + 二进制
        working-directory: upstream
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build                       # 必须先建前端：lib 里的 generate_context! 会读 dist
          cargo test --manifest-path src-tauri/Cargo.toml --lib --quiet   # 频谱等单测
          # 必须走 tauri CLI：裸 cargo build 不会把前端资源嵌进二进制（启动会白屏）
          node_modules/.bin/tauri build --no-bundle

      - name: 校验二进制（前端已嵌入 + 补丁痕迹）
        working-directory: upstream
        run: |
          set -euo pipefail
          bin=src-tauri/target/release/welkinplayer
          ls -lh "$bin"
          for pat in desktop-lyric-overlay index.html; do
            n=$(grep -a -c "$pat" "$bin" || true)
            echo "$pat -> $n"
            [ "$n" -ge 1 ] || { echo "::error::前端资源没有嵌入二进制"; exit 1; }
          done
          for pat in esc_quit_enabled audio_spectrum_config "audio:spectrum"; do
            n=$(grep -a -c "$pat" "$bin" || true)
            echo "$pat -> $n"
            [ "$n" -ge 1 ] || { echo "::error::补丁痕迹缺失：$pat"; exit 1; }
          done

      - name: 重打包成 Batocera 版并换入新二进制
        env:
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          bash kit/batocera/build/repack-welkin.sh upstream.AppImage - fixed.AppImage
          bash kit/batocera/build/swap-binary.sh \
            upstream/src-tauri/target/release/welkinplayer \
            fixed.AppImage \
            "Welkin_${VER}_amd64-batocera.AppImage"
          ls -lh *.AppImage
          sha256sum *.AppImage | tee sha256.txt
          cp upstream/src-tauri/target/release/welkinplayer welkinplayer-${VER}-patched

      - name: 生成 Release 说明
        env:
          VER: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REF: ${{ inputs.upstream_ref || '0c50d2bddd81289e1705642a97e82da6ef220bbf' }}
        run: |
          set -euo pipefail
          sha=$(awk '{print $1}' sha256.txt | head -1)
          sed -e "s|{{VERSION}}|${VER}|g" -e "s|{{TAG}}|${TAG}|g" \
              -e "s|{{REF}}|${REF}|g" -e "s|{{SHA256}}|${sha}|g" \
              kit/batocera/RELEASE-NOTES-TEMPLATE.md > notes.md
          cat notes.md

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.resolve.outputs.version }}
          REV: ${{ needs.resolve.outputs.rev }}
        run: |
          set -euo pipefail
          tag="batocera-${VER}-r${REV}"
          gh release create "$tag" \
            --title "Batocera 可用版 ${VER}-r${REV}（Escape 退出 + 全屏可视化）" \
            --notes-file notes.md \
            "Welkin_${VER}_amd64-batocera.AppImage" \
            "welkinplayer-${VER}-patched" \
            kit/batocera/build/repack-welkin.sh \
            kit/batocera/build/swap-binary.sh \
            kit/batocera/build/build-patched.sh \
            kit/batocera/patches/0002-escape-quit.diff \
            kit/batocera/patches/0003-audio-visualizer.diff \
            kit/batocera/README.md
          gh release view "$tag"
